# The Go version of Argo (prototype). Use it INSTEAD of docker-compose.yml, never next to it: both bots would
# poll the same token and fight over the updates.
services:
  argo:
    build:
      context: .
      dockerfile: go.Dockerfile
    container_name: argorobot-go
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is not set}
      OWNER_ID: ${OWNER_ID:?OWNER_ID is not set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is not set}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEV_LOG_CHAT: ${DEV_LOG_CHAT:-}
      DEV_LOG_THREAD_ID: ${DEV_LOG_THREAD_ID:-}
      LOG_CHAT_ID: ${LOG_CHAT_ID:-}
      LOG_THREAD_ID: ${LOG_THREAD_ID:-}
      COMMAND_PREFIXES: ${COMMAND_PREFIXES:-/!}
    networks:
      - default
      - postgres-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  postgres-internal:
    external: true
