services:
  argo:
    build: .
    container_name: argo
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file:
      - .env
    networks:
      - default             # outbound access to the Telegram API
      - postgres-internal   # access to the PostgreSQL container
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created by the PostgreSQL compose project; the bot only joins it.
  postgres-internal:
    external: true
