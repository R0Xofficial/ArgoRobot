# Argo (Go). Never run it next to the Python version with the same token: both bots would poll it and fight over
# the updates.
services:
  argo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argorobot-go
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is not set}
      OWNER_ID: ${OWNER_ID:?OWNER_ID is not set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is not set}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEV_LOG_CHAT: ${DEV_LOG_CHAT:-}
      DEV_LOG_THREAD_ID: ${DEV_LOG_THREAD_ID:-}
      LOG_CHAT_ID: ${LOG_CHAT_ID:-}
      LOG_THREAD_ID: ${LOG_THREAD_ID:-}
      COMMAND_PREFIXES: ${COMMAND_PREFIXES:-/!}
      SUPPORT_CHAT_USERNAME: ${SUPPORT_CHAT_USERNAME:-@ArgoRobotSupport}
      GITHUB_URL: ${GITHUB_URL:-}
      CHAT_CLEANUP_HOURS: ${CHAT_CLEANUP_HOURS:-24}
      LOG_REPORT_HOURS: ${LOG_REPORT_HOURS:-6}
      API_ID: ${API_ID:-}
      API_HASH: ${API_HASH:-}
    volumes:
      - argo-data:/app/data   # the MTProto session (see API_ID)
    networks:
      - default
      - postgres-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  argo-data:

networks:
  postgres-internal:
    external: true
