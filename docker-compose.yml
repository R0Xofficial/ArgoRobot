services:
  argo:
    build: .
    container_name: argorobot
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    # Values come from the stack's environment variables (Portainer) or from a
    # .env file next to this file (plain `docker compose`). Compose fails at
    # deploy time with a clear message if a required one is missing.
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is not set}
      OWNER_ID: ${OWNER_ID:?OWNER_ID is not set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is not set}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEV_LOG_CHAT: ${DEV_LOG_CHAT:-}
      DEV_LOG_THREAD_ID: ${DEV_LOG_THREAD_ID:-}
      LOG_CHAT_ID: ${LOG_CHAT_ID:-}
      LOG_THREAD_ID: ${LOG_THREAD_ID:-}
      CHAT_CLEANUP_HOURS: ${CHAT_CLEANUP_HOURS:-24}
      APPEAL_CHAT_USERNAME: ${APPEAL_CHAT_USERNAME:-}
      COMMAND_PREFIXES: ${COMMAND_PREFIXES:-/!}
      GITHUB_URL: ${GITHUB_URL:-}
    networks:
      - default             # outbound access to the Telegram API
      - postgres-internal   # access to the PostgreSQL container
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created by the PostgreSQL compose project; the bot only joins it.
  postgres-internal:
    external: true
