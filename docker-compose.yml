services:
  argo:
    build: .
    container_name: ArgoRobot
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides DATABASE_URL from .env: inside Docker the host is "postgres".
      DATABASE_URL: postgresql://argo:${POSTGRES_PASSWORD}@postgres:5432/argo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
